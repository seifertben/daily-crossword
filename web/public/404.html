<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Daily Crossword</title>
    <script>
      // GitHub Pages serves this file (404.html) for any path that does not
      // resolve to a real file. Redirect to the app root while preserving the
      // requested path in ?p= so the SPA can load the correct date. After the
      // redirect the root serves index.html (not this file), so this never loops.
      var path = location.pathname.replace(/^\//, "") + location.search;
      window.location.replace("/?p=" + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
