name: Generate Daily Puzzle

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      # New puzzles are published for the next Eastern Time day. 03:00 UTC is at
      # least one hour before ET midnight year-round (23:00 EDT, 22:00 EST), so
      # tomorrow's puzzle is always in place before ET rolls to a new day.
      - name: Determine puzzle date
        id: date
        run: echo "date=$(TZ=America/New_York date -d 'tomorrow' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Check if puzzle already exists
        id: check
        run: |
          if [ -f "web/public/puzzles/${{ steps.date.outputs.date }}.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Puzzle for ${{ steps.date.outputs.date }} already exists — no-op"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate puzzle
        if: steps.check.outputs.exists != 'true'
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            GEMINI_MODE=live PUZZLE_STORE=static uv run python -m generator "${{ steps.date.outputs.date }}"
          else
            echo "GEMINI_API_KEY not set — generating stub puzzle"
            GEMINI_MODE=stub PUZZLE_STORE=static uv run python -m generator "${{ steps.date.outputs.date }}"
          fi

      - name: Commit and push
        if: steps.check.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/puzzles
          if git diff --cached --quiet; then
            echo "No new puzzle to commit"
          else
            git commit -m "Generate puzzle for ${{ steps.date.outputs.date }}"
            git push
          fi